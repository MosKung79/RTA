  G.bonus=(p.combo===2?1:p.combo===3?2:0)+(G.pz?1:0);
  let card=null;
  if(p.combo===4){p.combo=0;if(G.sd_.length){card=G.sd_.pop();p.hand.push(card)}else card="none"}
  log("l_ok",p.name,card);
  G.target=alive().find(i=>i!==G.turn);
  G.phase="attack";render();
}
function setT(i){G.target=i;render()}
function dmgTo(d){
  const o=G.p[G.target],m=me();
  if(o.hp<=0)return{none:1,d:0};
  const raw=d,h={d,red:false,cn:null};
  if(o.shield){d=Math.max(0,d-2);o.shield=false;h.red=true;h.d=d}
  o.hp=Math.max(0,o.hp-d);G.dealt+=d;
  if(raw>=3&&o.counter){o.counter=false;m.hp=Math.max(0,m.hp-2);G.recoil=2;h.cn=o.name}
  return h;
}
function attack(){
  if(!G.ad.length)G.ad=sh(AT);
  const c=G.ad.pop(),d=1+(Math.random()*6|0),db=d<=2?0:d<=4?1:d===5?2:3;
  G.dealt=0;G.recoil=0;
  const tn=G.p[G.target].name,h=dmgTo(c.d+db+G.bonus);sfx("hit");
  G.res={k:"atk",t:tn,c,d,db,b:G.bonus,h};
  log("l_atk",me().name,c.n,tn,h);afterHit();
}
function doubleAtk(){
  G.dealt=0;G.recoil=0;
  const tn=G.p[G.target].name,a=dmgTo(2+G.bonus),b=dmgTo(2);sfx("hit");
  G.res={k:"dbl",t:tn,a,b};log("l_dbl",me().name,tn);afterHit();
}
function afterHit(){
  G.fx={t:G.target,d:G.dealt,a:G.recoil?G.turn:-1};
  const dead=[];
  G.p.forEach((p,i)=>{if(!p.out&&p.hp<=0){p.out=true;dead.push(i);log("l_out",p.name)}});
  const al=alive();
  if(al.length===1){finish(al[0],["w_last"]);return}
  if(al.length===0){dead.forEach(i=>G.p[i].out=false);tieBreak("w_sim",dead);return}
  G.phase="result";render();
}
function endTurn(){
  let x=G.turn;do{x=(x+1)%G.p.length}while(G.p[x].out);
  G.turn=x;G.phase="start";G.bonus=0;G.fx=null;render();
}
function useSp(i){
  const p=me(),k=p.hand[i];
  if(!(G.phase==="start"||G.phase==="attack")||G.sd)return;
  if(k==="double"){if(G.phase!=="attack")return;p.hand.splice(i,1);doubleAtk();return}
  p.hand.splice(i,1);
  sfx("sp");if(k==="shield"){p.shield=true;log("l_sh",p.name)}
  if(k==="heal"){p.hp=Math.min(MAXHP,p.hp+2);log("l_he",p.name)}
  if(k==="counter"){p.counter=true;log("l_co",p.name)}
  render();
}
function timeUp(){
  log("l_time");
  const al=alive(),mx=Math.max(...al.map(i=>G.p[i].hp)),c=al.filter(i=>G.p[i].hp===mx);
  if(c.length===1)return finish(c[0],["w_hp"]);
  tieBreak("w_tie",c);
}
function tieBreak(why,c){
  const mb=Math.max(...c.map(i=>G.p[i].best)),c2=c.filter(i=>G.p[i].best===mb);
  if(c2.length===1)return finish(c2[0],[why,"w_combo"]);
  log("l_sdg");
  G.sd=true;G.sdp=c2;G.sdi=0;G.sdr=[];G.turn=c2[0];G.phase="start";G.left=0;render();
}
function finish(w,why){sfx("win");G.phase="over";G.win=w;G.why=why;clearInterval(timer);render()}
function again(){clearInterval(timer);G={phase:"intro"};render()}
function fmtHit(h){return t("hit",h)}
function resHtml(){
  const r=G.res;if(!r)return "";
  const tl=`<div class="mu">${esc(t("tg",r.t))}</div>`;
  if(r.k==="atk")return `${tl}<div class="acard"><div class="ai">${r.c.i}</div><div class="an">${r.c.n}</div><div class="ad">${r.c.d}</div></div><div><span class="dice">${DICE[r.d-1]}</span> ${esc(t("roll",r.d,r.db,r.b))}</div><div class="big">${t("tot")} ${esc(fmtHit(r.h))}</div>`;
  return `${tl}<div class="big">⚡ Double Attack</div><div>${t("h1")} ${esc(fmtHit(r.a))}</div><div>${t("h2")} ${esc(fmtHit(r.b))}</div>`;
}
const AU={ctx:null,mg:null,sg:null,nb:null,track:"0",mv:.5,sv:.7,timer:null,step:0,next:0,el:null,playing:false,open:false};
try{const o=JSON.parse(localStorage.getItem("rta-au")||"{}");if(["0","1","2"].includes(o.track))AU.track=o.track;if(o.mv>=0&&o.mv<=1)AU.mv=o.mv;if(o.sv>=0&&o.sv<=1)AU.sv=o.sv}catch(e){}
const F=m=>440*Math.pow(2,(m-69)/12);
function ensureCtx(){
  if(!AU.ctx){AU.ctx=new(window.AudioContext||window.webkitAudioContext)();AU.mg=AU.ctx.createGain();AU.sg=AU.ctx.createGain();AU.mg.connect(AU.ctx.destination);AU.sg.connect(AU.ctx.destination)}
  AU.mg.gain.value=AU.mv*.8;AU.sg.gain.value=AU.sv;if(AU.ctx.resume)AU.ctx.resume();
}
function tone(t0,m,dur,type,vol,o={}){
  const c=AU.ctx,os=c.createOscillator(),g=c.createGain();os.type=type;os.frequency.value=F(m);
  let n=os;if(o.lp){const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=o.lp;os.connect(f);n=f}
  const a=o.att||.01;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+a);
  if(o.decay)g.gain.exponentialRampToValueAtTime(.0001,t0+dur);else{g.gain.setValueAtTime(vol,t0+Math.max(a,dur-.06));g.gain.linearRampToValueAtTime(0,t0+dur)}
  n.connect(g);g.connect(o.dest||AU.mg);os.start(t0);os.stop(t0+dur+.05);
}
function bell(t0,m,dur,vol,dest){tone(t0,m,dur,"triangle",vol,{decay:1,dest});tone(t0,m+19,dur*.6,"sine",vol*.25,{decay:1,dest})}
function noise(t0,dur,vol,type,freq,dest){
  const c=AU.ctx;if(!AU.nb){const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b}
  const s=c.createBufferSource();s.buffer=AU.nb;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=c.createGain();
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(dest||AU.mg);s.start(t0);s.stop(t0+dur);
}
function kick(t0,vol,dest){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(140,t0);o.frequency.exponentialRampToValueAtTime(40,t0+.18);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.3);o.connect(g);g.connect(dest||AU.mg);o.start(t0);o.stop(t0+.32)}
const mel=bars=>{const M={};bars.forEach((b,i)=>b.forEach(([s,n,l])=>M[i*6+s]=[n,l]));return M};
/* Track 1: original high-seas adventure (D minor, 6/8) */
const M1=mel([[[0,69,1],[1,74,1],[2,77,1],[3,76,2],[5,74,1]],[[0,72,1],[1,74,1],[2,72,1],[3,69,3]],[[0,70,1],[1,74,1],[2,77,1],[3,79,2],[5,77,1]],[[0,76,1],[1,79,1],[2,76,1],[3,72,3]],[[0,74,1],[1,77,1],[2,81,1],[3,79,2],[5,77,1]],[[0,74,1],[1,70,1],[2,74,1],[3,79,3]],[[0,73,1],[1,76,1],[2,81,1],[3,80,1],[4,81,1],[5,76,1]],[[0,74,3],[3,77,2],[5,76,1]]]);
const C1=[[62,65,69],[62,65,69],[58,62,65],[60,64,67],[62,65,69],[58,62,67],[57,61,64],[62,65,69]],B1=[38,38,34,36,38,31,33,38];
/* Track 2: original magic-castle waltz (F# minor, 3/4) */
const M2=mel([[[0,66,1],[1,69,1],[2,73,2],[4,71,1],[5,69,1]],[[0,66,1],[1,69,1],[2,73,2],[4,78,2]],[[0,74,1],[1,78,1],[2,81,2],[4,78,1],[5,74,1]],[[0,71,1],[1,74,1],[2,78,2],[4,76,1],[5,74,1]],[[0,73,1],[1,76,1],[2,78,2],[4,81,2]],[[0,73,1],[1,77,1],[2,80,2],[4,77,1],[5,73,1]],[[0,74,1],[1,78,1],[2,74,2],[4,71,2]],[[0,73,3],[3,69,3]]]);
const C2=[[54,57,61],[54,57,61],[50,54,57],[47,50,54],[54,57,61],[49,53,56],[50,54,57],[54,57,61]],AP=[0,1,2,3,2,1];
const TR={
"1":{d:.17,len:48,play(s,t0,d){
  const b=s/6|0,p=s%6;
  if(p===0)C1[b].forEach(n=>tone(t0,n,d*6,"sawtooth",.035,{lp:900,att:.1}));
  if(p===0||p===3)tone(t0,B1[b]+(p===3?7:0),d*2.4,"triangle",.3);
  if(p===0)kick(t0,.8);
  if(p===3){noise(t0,.14,.35,"bandpass",1800);kick(t0,.35)}
  if(b===7&&p>=4)kick(t0,.5);
  noise(t0,.04,.06,"highpass",7000);
  const m=M1[s];if(m)tone(t0,m[0],m[1]*d*.95,"sawtooth",.12,{lp:2600,att:.02});
}},
"2":{d:.3,len:48,play(s,t0,d){
  const b=s/6|0,p=s%6,c=C2[b];
  if(p===0){c.forEach(n=>tone(t0,n+12,d*6,"sine",.05,{att:.4}));tone(t0,c[0]-12,d*3,"sine",.22,{att:.03})}
  bell(t0,c[AP[p]]+24,d*3,.11);
  const m=M2[s];if(m)bell(t0,m[0],m[1]*d*2,.2);
}}};
function sched(){const T_=TR[AU.track];if(!T_||!AU.ctx)return;while(AU.next<AU.ctx.currentTime+.4){T_.play(AU.step%T_.len,AU.next,T_.d);AU.next+=T_.d;AU.step++}}
function stopMusic(){clearInterval(AU.timer);AU.timer=null;if(AU.el)AU.el.pause();AU.playing=false}
function startMusic(){
  stopMusic();
  if(AU.track==="own"){if(AU.el){AU.el.volume=AU.mv;AU.el.play().catch(()=>{});AU.playing=true}return}
  if(!TR[AU.track])return;
  ensureCtx();AU.step=0;AU.next=AU.ctx.currentTime+.1;AU.timer=setInterval(sched,100);sched();AU.playing=true;
}
function saveAu(){try{localStorage.setItem("rta-au",JSON.stringify({track:AU.track==="own"?"0":AU.track,mv:AU.mv,sv:AU.sv}))}catch(e){}}
function setTrack(v){AU.track=v;saveAu();if(v==="0"||v==="own")stopMusic();if(v==="1"||v==="2")startMusic();render()}
function ownFile(inp){const f=inp.files&&inp.files[0];if(!f)return;if(AU.el)AU.el.pause();AU.el=new Audio(URL.createObjectURL(f));AU.el.loop=true;startMusic();render()}
function setMv(v){AU.mv=+v;if(AU.mg)AU.mg.gain.value=AU.mv*.8;if(AU.el)AU.el.volume=AU.mv}
function setSv(v){AU.sv=+v;if(AU.sg)AU.sg.gain.value=AU.sv}
function togAu(){AU.open=!AU.open;render()}
function sfx(k){
  if(AU.sv<=0)return;
  try{ensureCtx();const c=AU.ctx,n=c.currentTime+.01,d=AU.sg;
  if(k==="ok"){bell(n,84,.5,.25,d);bell(n+.11,91,.7,.25,d)}
  if(k==="no"){tone(n,45,.35,"sawtooth",.25,{lp:400,dest:d});tone(n+.12,40,.3,"sawtooth",.22,{lp:400,dest:d})}
  if(k==="hit"){kick(n,.9,d);noise(n,.25,.5,"lowpass",1500,d)}
  if(k==="sp"){[88,93,97].forEach((m,i)=>bell(n+i*.07,m,.5,.2,d))}
  if(k==="win"){[72,76,79,84,88,91].forEach((m,i)=>{tone(n+i*.13,m,.5,"sawtooth",.16,{lp:2500,dest:d});bell(n+i*.13,m+12,.8,.15,d)})}}catch(e){}
}
function audioPanel(){
  return `<div class="aup"><b>${t("snd")}</b>
  <select onchange="setTrack(this.value)">${[["0",t("off")],["1",t("t1")],["2",t("t2")],["own",t("t3")]].map(x=>opt(x[0],x[1],AU.track)).join("")}</select>
  ${AU.track==="own"?`<input type="file" accept="audio/*" onchange="ownFile(this)">`:""}
  <label class="mu">${t("vm")}<input type="range" min="0" max="1" step="0.05" value="${AU.mv}" oninput="setMv(this.value)" onchange="saveAu()"></label>
  <label class="mu">${t("vs")}<input type="range" min="0" max="1" step="0.05" value="${AU.sv}" oninput="setSv(this.value)" onchange="saveAu()"></label>
  <div class="mu">${t("anote")}</div></div>`;
}
function bar(){return `<div class="bar"><div class="logo">⚔️ R-T-A</div><div style="display:flex;gap:8px;align-items:center"><button class="snd" onclick="togAu()" title="${t("snd")}">${AU.playing?"🔊":"🎵"}</button><div class="lang"><button class="${LG==="th"?"on":""}" onclick="setLang('th')">🇹🇭 ไทย</button><button class="${LG==="en"?"on":""}" onclick="setLang('en')">🇬🇧 EN</button></div></div></div>${AU.open?audioPanel():""}`}
function pl(i){
  const p=G.p[i],act=G.turn===i&&G.phase!=="over"&&!p.out,fx=G.phase==="result"&&G.fx;
  const hit=fx&&(fx.t===i||fx.a===i),num=fx?(fx.t===i?fx.d:fx.a===i?2:0):0;
  const hand=p.hand.map((k,j)=>{
    const ok=act&&!G.sd&&(G.phase==="start"||G.phase==="attack")&&!(k==="double"&&G.phase!=="attack");
    return `<button class="sp" title="${SPT[LG][k]}" ${ok?"":"disabled"} onclick="useSp(${j})">${SPD[k][0]} ${SPD[k][1]}</button>`}).join("");
  const pc=p.hp/MAXHP*100,col=pc>50?"linear-gradient(90deg,#22c55e,#a3e635)":pc>25?"linear-gradient(90deg,#f59e0b,#fde047)":"linear-gradient(90deg,#ef4444,#f97316)";
  return `<div class="pl ${act?"act":""} ${p.out?"out":""} ${hit?"hit":""}">${hit&&num?`<span class="fl">-${num}</span>`:""}<h3><span class="av">${p.out?"💀":AV[i%AV.length]}</span>${esc(p.name)}</h3>
  <div class="hpbar"><i style="width:${pc}%;background:${col}"></i></div><b>❤️ ${p.hp}/${MAXHP}</b><span class="bd">${p.shield?"🛡️":""}${p.counter?"🔄":""}</span>
  <div class="mu">${t("cmb",p.combo,p.best)}</div><div class="hand">${hand||`<span class="mu">${t("nosp")}</span>`}</div></div>`;
}
function render(){
  const A=$("app");
  if(G.phase==="intro"){
    A.innerHTML=bar()+`<div class="hero"><h1 class="ttl">R-T-A<br><small>QUICK BATTLE</small></h1><div class="tag">Read → Translate → Attack!</div><p class="mu">${t("sub")}</p></div>
    <div class="stage"><div style="max-width:360px;margin:0 auto;display:grid;gap:8px">
    <select id="n">${[2,3,4,5,6].map(v=>opt(v,t("n",v),CFG.n)).join("")}</select>
    <select id="hpx">${[15,20,25,30,35,40,45,50].map(v=>opt(v,`❤️ ${v} HP`+(HH[v]?" — "+HH[v][LG==="en"?1:0]:""),CFG.hp)).join("")}</select>
    <select id="ct">${CTS.map(x=>opt(x[0],L(x),CFG.ct)).join("")}</select>
    <select id="lv">${LVS.map(x=>opt(x[0],L(x),CFG.lv)).join("")}</select>
    <select id="pz">${PZS.map(x=>opt(x[0],L(x),CFG.pz)).join("")}</select>
    <select id="tm">${[10,15,20,30].map(v=>opt(v,t("tm",v),CFG.time)).join("")}</select></div>
    <div class="rules">${t("rules")}</div><button onclick="toNames()">${t("next")}</button></div>`;return;
  }
  if(G.phase==="names"){
    A.innerHTML=bar()+`<div class="stage"><h1>${t("namesH")}</h1><p class="mu">${esc(infoStr(CFG))}</p>
    <div style="max-width:340px;margin:10px auto;display:grid;gap:8px">${[...Array(CFG.n)].map((_,i)=>`<input id="pn${i}" value="${esc(CFG.names[i]||t("pn",i+1))}" maxlength="14" placeholder="${esc(t("nph",i+1))}">`).join("")}</div>
    <div class="row"><button class="gh" onclick="back()">${t("back")}</button><button onclick="go()">${t("start")}</button></div></div>`;return;
  }
  let st="";const p=me();
  if(G.phase==="start")st=`<div class="big">${AV[G.turn%AV.length]} ${esc(t("turn",p.name))}</div><div class="mu">${G.sd?t("sdq"):"STEP 1 — Draw"}</div><div class="row"><button onclick="drawWord()">${t("draw")}</button></div>${G.sd?"":`<div class="mu" style="margin-top:8px">${t("sph")}</div>`}`;
  if(G.phase==="word")st=`<div class="mu">${esc(t("s2",p.name,!!G.pz))}</div><div class="vcard"><div class="word" style="${G.pz?"letter-spacing:.1em":""}">${esc(G.pz&&!G.rev?G.pz:G.word[0])}</div>
    <div class="th">${G.rev?esc(G.word[1]):""}</div></div><div class="tb"><i id="wt" class="${G.tl<=3?"low":""}" style="width:${G.tl*10}%"></i></div><div class="mu" id="wn">${G.tl} ${t("sec")}</div>
    <div class="row">${G.pz&&!G.rev?"":`<button class="gh" onclick="speak()">${t("listen")}</button>`}<button class="gh" onclick="reveal()">${t("rev")}</button></div>
    <div class="row"><button class="ok" onclick="judge(true)">${t("ok")}</button><button class="no" onclick="judge(false)">${t("no")}</button></div>`;
  if(G.phase==="attack"){
    const opps=alive().filter(i=>i!==G.turn);
    if(!opps.includes(G.target))G.target=opps[0];
    const tg=opps.length>1?`<div class="mu">${t("pick")}</div><div class="row">${opps.map(i=>`<button class="tg ${i===G.target?"on":"gh"}" onclick="setT(${i})">${AV[i%AV.length]} ${esc(G.p[i].name)} ❤️${G.p[i].hp}</button>`).join("")}</div>`:`<div class="mu">${esc(t("tg",G.p[opps[0]].name))}</div>`;
    st=`<div class="big">${t("corr",p.combo||4)}</div><div class="mu">${G.bonus?t("bon",G.bonus):"STEP 3 — Attack"}</div>${tg}<div class="row"><button onclick="attack()">${t("datk")}</button></div><div class="mu" style="margin-top:8px">${t("dh")}</div>`;
  }
  if(G.phase==="result")st=`${resHtml()}<div class="row"><button onclick="endTurn()">${t("endt")}</button></div>`;
  if(G.phase==="over")st=`<div class="trophy">🏆</div><div class="big">${esc(t("win",G.p[G.win].name))}</div><div class="mu">${esc(G.why.map(k=>t(k)).join(" — "))}</div><div class="row"><button onclick="again()">${t("again")}</button></div>`;
  A.innerHTML=bar()+`<div class="top"><div class="mu">${esc(infoStr(G.cfg))}</div><div class="clock" id="gt"></div></div>
  <div class="pls">${G.p.map((_,i)=>pl(i)).join("")}</div><div class="stage">${st}</div>
  <div class="log">${G.log.map(([k,a])=>`<div>• ${esc(t(k,...a))}</div>`).join("")}</div>`;
  clock();
}
document.documentElement.lang=LG;
document.addEventListener('pointerdown',()=>{if(AU.track!=='0'&&!AU.playing)startMusic()},{once:true});
render();
</script>
